# Web相关配置
web_config:
  # 服务端口
  port: 5555
  # 图床路径
  img_bed_path: "https://your-image-bed-domain.com"


# 七牛云对象存储配置
qi_niu:
  cos:
    # 七牛云访问密钥
    access_key: "your_qiniu_access_key"
    # 七牛云私钥
    secret_key: "your_qiniu_secret_key"
    # 存储桶名称
    bucket: "your_bucket_name"
    # 七牛云域名
    url: "http://your-domain.com/"
    # 路径前缀
    path: "img/"
    # 策略过期时间(秒)
    policy_expire: 3600

# 腾讯云对象存储配置
tencent:
  cos:
    # 腾讯云密钥ID
    secret_id: "your_tencent_secret_id"
    # 腾讯云密钥
    secret_key: "your_tencent_secret_key"
    # 地域
    region: "your_region"
    # 存储桶名称
    bucket: "your_bucket_name"
    # 腾讯云COS域名
    url: "https://your-cos-domain.com/"
    # 路径前缀
    path: "img/"
    # 策略过期时间(秒)
    policy_expire: 3600
    # 编码格式
    code_format: "UTF-8"


# 百度云平台OCR配置
aip_ocr:
  # 应用ID
  client_id: "your_baidu_client_id"
  # 密钥
  client_secret: "your_baidu_client_secret"

# 图片加载配置
image_load:
  # 图片加载密钥
  key: "your_image_load_key"


# 天气API配置
weather:
  # 天气API密钥
  key: "your_weather_key"

# GitHub配置
github:
  # GitHub用户名
  owner: "your_github_owner"
  # 仓库名称
  repo: "your_repo_name"
  # GitHub访问令牌
  access-token: "your_github_access_token"

# Warframe 世界状态词库数据源配置
warframe:
  market:
    # 普通物品的每日成交统计同步。
    statistics:
      # 是否启用每日成交归档同步。
      enabled: true
      # 下载历史归档的单次请求超时，秒；范围30～600。
      history-request-timeout-seconds: 120
      # UTC 02:30 = 北京时间 10:30，同步前一完整 UTC 日。
      # 每日同步的UTC小时，范围0～23。
      daily-sync-utc-hour: 2
      # 每日同步的分钟，范围0～59。
      daily-sync-utc-minute: 30
      # 归档未发布或同步失败时，每小时重试；成功后等待下一日。
      # 重试间隔，小时；范围1～168。
      interval-hours: 1
    # 紫卡合约搜索每分钟的请求上限，与其他WM请求共用全局限流。
    # Cloudflare 对 /v1/auctions/search 实测约 5～7 次/分钟，超出封锁 120 秒；4 次/分钟留余量。
    contract-search-requests-per-minute: 4
    # 紫卡样本、价格参考和热门武器预热。
    riven-samples:
      # 样本入库、价格参考和维护总开关；关闭后用户查询短缓存仍可用。
      enabled: true
      # 非空查询结果的缓存时长，秒；范围60～3600。
      cache-seconds: 600
      # 成功空结果的缓存时长，秒；不短于cache-seconds，最多86400。
      empty-cache-seconds: 1800
      # 同一查询条件失败后的冷却时长，分钟；范围1～1440。
      failure-cooldown-minutes: 15
      # 每UTC日预热与分析补采的总额度；USER另计，共用分钟限流。
      daily-limit: 140
      analysis:
        # 缓存不占额；发送前占额，失败或崩溃不返还。
        daily-limit: 40
        refresh-hours: 6
        weapon-interval-minutes: 60
      # 三类价格参考的观察窗口，小时；范围1～168，与observation-max-hours取较小值。
      reference-max-age-hours: 72
      # 距最近观察超过此小时数时，样本无效；范围1～168。
      observation-max-hours: 72
      # 相似估价和零洗参考各次读取的样本上限，条；范围100～10000。
      maximum-reference-samples: 2000
      # 每日热门预热；只有上面的样本总开关开启时才生效。
      warmup:
        # 是否启用预热；关闭后仍保留按需查询和样本清理。
        enabled: true
        # 每UTC日最多100次，给分析补采保留40次；北京时间08:00重置。
        daily-limit: 100
        # 两次预热尝试的最小间隔，秒；范围30～3600，共用Redis的实例共享。
        interval-seconds: 300
        weapon-limit: 50
        hot-weapon-count: 10
        hot-refresh-hours: 4
        refresh-hours: 24
  public-export-plus:
    # owner/repo 格式，可替换为上游 calamity-inc/warframe-public-export-plus 或自己的 fork
    repository: "2094085327/warframe-public-export-plus"
    branch: "senpai"
    directory: "resources/warframe/public-export-plus"

# 项目自定义配置
wuLiang:
  config:
    # 后台管理账号密码
    userName: "your_admin_username"
    password: "your_admin_password"

# Swagger API文档配置
swagger:
  # 是否启用Swagger
  enabled: true
  # 路径映射
  pathMapping:

# Spring框架配置
##配置数据源
spring:
  # Servlet配置
  servlet:
    multipart:
      # 是否启用文件上传
      enabled: true
      # 最大文件大小
      max-file-size: 1024MB
      # 最大请求大小
      max-request-size: 1024MB
  # Redis配置
  redis:
    # Redis主机地址
    host: your_redis_host
    # Redis端口
    port: your_redis_port
    # Redis密码
    password: "your_redis_password"
  # 数据源配置
  datasource:
    # 数据库驱动类名
    driver-class-name: org.mariadb.jdbc.Driver
    # 数据库连接URL
    url: jdbc:mariadb://your_host:port/database
    # 数据库用户名
    username: your_database_username
    # 数据库密码
    password: your_database_password
    # 数据源类型
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid连接池配置
    druid:
      # 初始化连接数
      initial-size: 1
      # 最小空闲连接数
      min-idle: 1
      # 最大活跃连接数
      max-active: 6
      # 获取连接等待超时的时间
      max-wait: 5000
      # 连接有效性检测SQL
      validation-query: SELECT 1
      # 验证查询超时时间
      validation-query-timeout: 5
      # 空闲时是否验证连接有效性
      test-while-idle: true
      # 获取连接时是否验证有效性
      test-on-borrow: false
      # 归还连接时是否验证有效性
      test-on-return: false
      # 是否开启连接保活机制
      keep-alive: true
      # 销毁线程检测间隔时间（毫秒）
      time-between-eviction-runs-millis: 10000
      # 连接最小空闲存活时间（毫秒）
      min-evictable-idle-time-millis: 60000
      # 是否开启泄露连接回收机制
      remove-abandoned: true
      # 连接泄露回收超时时间（秒）
      remove-abandoned-timeout: 1800
      # 是否记录泄露连接的堆栈信息
      log-abandoned: true
    # 防火墙配置
    filter:
      wall:
        config:
          # 是否显示允许的SQL
          show-allow: true
    # Web统计过滤器配置
    web-stat-filter:
      # 是否启用
      enabled: true
      # URL匹配模式
      url-pattern: /*
      # 设置不统计哪些URL
      exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # 是否开启session统计功能
      session-stat-enable: true
      # session统计最大个数
      session-stat-max-count: 100
    # StatViewServlet配置(用于监控页面)
    stat-view-servlet:
      # 是否启用
      enabled: true
      # URL匹配模式
      url-pattern: /druid/*
      # 是否允许重置统计
      reset-enable: true
      # 监控页面登录用户名
      login-username: your_druid_username
      # 监控页面登录密码
      login-password: your_druid_password
      # 允许访问的IP地址
      allow: 127.0.0.1
  # RabbitMQ消息队列配置
  rabbitmq:
    # RabbitMQ主机地址
    host: your_rabbitmq_host
    # RabbitMQ端口
    port: your_rabbitmq_port
    # RabbitMQ用户名
    username: your_rabbitmq_username
    # RabbitMQ密码
    password: your_rabbitmq_password
    # 消息发送到交换机确认机制
    publisher-confirm-type: correlated
    # 消息发送到队列确认机制
    publisher-returns: true
    # 虚拟主机
    virtual-host: /
    # 监听器配置
    listener:
      simple:
        # 消费者最小数量
        concurrency: 10
        # 最大消费者数量
        max-concurrency: 10
        # 每次处理消息数量
        prefetch: 1
        # 启动时是否默认启动容器
        auto-startup: true
        # 被拒绝时重新进入队列
        default-requeue-rejected: true

# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML文件位置
  mapper-locations: classpath*:mapper/*.xml, classpath:mapper/log/*.xml
  # 别名包扫描路径
  type-aliases-package: bot.wuliang.entity
  # 全局配置
  global-config:
    db-config:
      # 主键类型
      id-type: auto
      # 字段验证策略
      field-strategy: NOT_EMPTY
      # 数据库类型
      db-type: MYSQL
  # MyBatis原生配置
  configuration:
    # 默认执行器类型
    default-executor-type: simple
    # 允许JDBC支持自动生成主键
    use-generated-keys: true
    # 是否开启驼峰命名规则映射
    map-underscore-to-camel-case: true
    # 当查询结果为空值时，是否调用Setter方法
    call-setters-on-nulls: true

# 日志配置
logging:
  level:
    # 项目日志级别
    bot.wuliang: info
    # 腾讯云SDK日志级别
    com.qcloud: error